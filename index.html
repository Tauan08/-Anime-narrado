<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Dubber AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Anime Dubber Platform 🎧</h1>
        <p class="subtitle">Anexe o vídeo do anime e a legenda para gerar a narração em tempo real</p>

        <div class="upload-section">
            <div class="file-input">
                <label for="videoFile">🎬 Selecionar Vídeo (MP4):</label>
                <input type="file" id="videoFile" accept="video/mp4, video/webm">
            </div>
            
            <div class="file-input">
                <label for="srtFile">📝 Selecionar Legenda (.SRT ou .VTT):</label>
                <input type="file" id="srtFile" accept=".srt,.vtt">
            </div>
        </div>

        <div class="controls-section">
            <label for="voiceSelect">🗣️ Escolha a Voz:</label>
            <select id="voiceSelect"><option value="">Carregando vozes...</option></select>

            <div class="sliders">
                <label>Velocidade: <span id="rateVal">1.2</span>x</label>
                <input type="range" id="rate" min="0.5" max="2" value="1.2" step="0.1">
            </div>
        </div>

        <div class="player-container">
            <video id="videoPlayer" controls>
                Seu navegador não suporta a reprodução de vídeos.
            </video>
        </div>
    </div>

    <script href="script.js" src="script.js"></script>
</body>
</html>
